# Student Report Generator — Python 3 + Flask + ReportLab
# PEP 621 project metadata (https://peps.python.org/pep-0621/)

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-report-generator"
version = "0.1.0"
description = "Server-side Student Report Generator (Python 3 + Flask + ReportLab)"
readme = "Readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ajitblitzy" },
]
keywords = ["flask", "reportlab", "pdf", "student", "report", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Office/Business",
]
dependencies = [
    "Flask==3.1.3",
    "reportlab==4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[project.urls]
Repository = "https://github.com/ajitblitzy/Student_Mngt"

[tool.setuptools]
packages = ["report_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
